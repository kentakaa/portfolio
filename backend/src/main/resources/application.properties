# Spring Boot Application Properties
# Environment-based configuration will be added in later phases

spring.application.name=portfolio-backend

# Server configuration
server.port=${PORT:8080}

# Spring MVC configuration
spring.mvc.content.max-file-size=10MB
spring.mvc.content.max-request-size=10MB

# MongoDB Atlas connection (defaults to local so `spring-boot:run` works without env)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/portfolio}

# Logging configuration
logging.level.root=INFO
logging.level.com.portfolio=INFO

# Active profile
spring.profiles.active=dev

# CORS configuration
cors.origin=http://127.0.0.1:3000,https://arshad-developer-portfolio.netlify.app